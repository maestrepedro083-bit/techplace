<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="Tech Place">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/tech-place-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/tech-place-180.png">
  <meta name="description" content="Painel de assistência técnica, vendas, estoque e caixa da Tech Place Store.">
  <title>Tech Place Store</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="auth-page" id="shop-auth">
    <section class="panel auth-card" aria-labelledby="auth-title">
      <div class="auth-heading"><span class="brand-icon brand-monogram" aria-hidden="true">TP</span><h1 id="auth-title">Tech Place Store</h1></div>
      <p id="auth-waiting" role="status">Verificando acesso…</p>
      <div class="auth-modes" role="group" aria-label="Opção de acesso" hidden>
        <button class="btn" type="button" data-auth-mode="login" aria-pressed="true">Já tenho conta</button>
        <button class="btn" type="button" data-auth-mode="register" aria-pressed="false">Criar conta</button>
      </div>
      <p class="notice" id="auth-error" role="alert" hidden></p>
      <form id="shop-auth-form" class="auth-form" method="post" hidden>
        <label>Nome<input name="name" autocomplete="username" minlength="2" maxlength="70" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="128" aria-describedby="auth-password-hint" required></label>
        <p id="auth-password-hint" hidden>Use pelo menos 10 caracteres.</p>
        <button class="btn primary" type="submit" id="auth-submit">Entrar</button>
      </form>
      <a class="btn text" id="auth-open-tab" href="/" target="_blank" rel="noopener noreferrer" hidden>Abrir em nova aba</a>
    </section>
  </main>
  <div class="shell" id="dashboard" hidden>
    <aside class="sidebar" data-menu="closed">
      <div class="sidebar-heading"><a href="#inicio" class="brand" aria-label="Tech Place Store, início">
        <span class="brand-icon brand-monogram" aria-hidden="true">TP</span>
        <span class="brand-name">Tech Place<small>Store</small></span>
      </a><button class="mobile-menu" type="button" id="mobile-menu" aria-controls="primary-nav" aria-expanded="false">
        <span data-icon="menu"></span><span>Menu</span>
      </button></div>
      <nav id="primary-nav" aria-label="Navegação principal">
        <a href="#inicio" data-page="inicio"><span data-icon="layout"></span><span>Início</span></a>
        <a href="#vendas" data-page="vendas"><span data-icon="cart"></span><span>Vendas</span></a>
        <a href="#servicos" data-page="servicos"><span data-icon="clipboard"></span><span>Serviços</span></a>
        <a href="#precos" data-page="precos"><span data-icon="receipt"></span><span>Preços de peças</span></a>
        <a href="#estoque" data-page="estoque"><span data-icon="box"></span><span>Estoque</span></a>
        <a href="#caixa" data-page="caixa"><span data-icon="wallet"></span><span>Caixa</span></a>
        <a href="#agente" data-page="agente"><span data-icon="sparkles"></span><span>Agente Universal</span></a>
        <details class="nav-more" id="more-tools">
          <summary>Mais ferramentas</summary>
          <a href="#peliculas" data-page="peliculas"><span data-icon="phone"></span><span>Películas</span></a>
          <a href="#conhecimento" data-page="conhecimento"><span data-icon="book"></span><span>Conhecimento</span></a>
          <a href="#assistente" data-page="assistente"><span data-icon="sparkles"></span><span>Assistente</span></a>
        </details>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span id="sync-status" role="status">Conectando…</span>
        <div class="top-actions">
          <span id="account-name"></span>
          <button class="icon-button" id="refresh" type="button" aria-label="Atualizar dados" title="Atualizar dados"><span data-icon="refresh"></span></button>
          <button class="btn text" id="logout" type="button">Sair</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="notice" id="error" hidden></div>
        <div id="content" aria-busy="true"></div>
      </main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
